; Platform-only configuration used with build/dinput8-platform.dll.
; This file intentionally contains only the independent [platform] options.
[platform]
; Disable DirectInput keyboard/mouse exclusive mode and unclip the cursor.
; 关闭 DirectInput 键盘/鼠标独占并解除光标限制，允许前台游戏期间使用后台全局热键。
shared_input=1
window_mode=1
render_width=0
render_height=0
; Use the active desktop mode for the D3D backbuffer while preserving the game's logical render size.
; D3D 后备缓冲区使用当前桌面分辨率；保留游戏内部渲染尺寸，避免只改视口造成画面裁切。
native_resolution=1
; Scale the game's logical image to fill the native backbuffer: 0=off, 1=on.
; 将游戏逻辑画面放大铺满原生缓冲区：0=关闭，1=开启。
scale_to_fill=1
; Scale filter: 0=point, 1=linear, 2=sharp Catmull-Rom reconstruction for a clear full-screen image.
; 缩放滤镜：0=点采样，1=线性，2=锐利的 Catmull-Rom 重建，默认适用于清晰全屏显示。
scale_filter=2
disable_game_ime=0
com_apartment_compat=0
close_without_confirmation=1
