; Platform-only configuration used with build/dinput8-platform.dll.
; This file intentionally contains only the independent [platform] options.
[platform]
; Disable DirectInput keyboard/mouse exclusive mode and unclip the cursor.
; 关闭 DirectInput 键盘/鼠标独占并解除光标限制，允许前台游戏期间使用后台全局热键。
shared_input=1
window_mode=1
render_width=0
render_height=0
; Use one primary-chain Present per frame so Steam/RTSS sees one frame and overlays stay attached.
; 每帧只提交一次主交换链，让 Steam/RTSS 按一帧统计，覆盖层保持在游戏画面上。
single_present=1
; Use desktop-sized output when the game render size is below desktop; keep explicit larger render targets.
; 游戏渲染尺寸低于桌面时使用桌面尺寸输出；显式高于桌面的渲染缓冲区保持原尺寸。
native_resolution=1
; Scale the game's logical image to fill the native backbuffer: 0=off, 1=on.
; 将游戏逻辑画面放大铺满原生缓冲区：0=关闭，1=开启。
scale_to_fill=1
; Scale filter: 0=point, 1=linear, 2=sharp Catmull-Rom reconstruction for a clear full-screen image.
; 缩放滤镜：0=点采样，1=线性，2=锐利的 Catmull-Rom 重建，默认适用于清晰全屏显示。
scale_filter=2
; Optional internal render resolution for Dynasty Warriors 8 (Launch.exe). Set both values and keep the game's aspect ratio; 0 keeps the native render size.
; 真三国无双7（Launch.exe）可选内部渲染分辨率。宽高需同时设置并保持游戏宽高比；0 保留原始渲染尺寸。
; Example for 4K rendering: internal_render_width=3840 and internal_render_height=2160.
; 4K 渲染示例：internal_render_width=3840，internal_render_height=2160。
; Replaces engine resolution profiles; the INI controls the actual size regardless of the selected game profile. Unknown builds are left untouched.
; 替换引擎分辨率档位，实际尺寸由本 INI 决定，不受游戏所选档位影响；不匹配的版本不会改写。
; Higher internal resolutions use more GPU memory and may reduce performance; display output remains desktop-sized.
; 更高内部分辨率会增加显存占用并可能降低性能；显示输出仍使用桌面分辨率。
internal_render_width=3840
internal_render_height=2160
disable_game_ime=0
com_apartment_compat=0
close_without_confirmation=1

; 3D camera distance: 100=original, 125=farther, 150=further; valid 50..300.
; 真三7 3D 镜头远近：100=原始，125=稍远，150=更远；可设 50 到 300。
; Reloaded within 500 ms; move the character/camera to rebuild a cached view.
; 保存后约半秒读取；移动角色或转动视角即可刷新已缓存的镜头。
; Moves the viewpoint, preserving FOV, character proportions and HUD scale.
; 移动镜头位置，保持 FOV、人物比例和 HUD 大小不变。
; Large values can place the viewpoint behind walls; native collision is unchanged.
; 倍率过大可能退到墙后；游戏原有镜头避障不会按此倍率扩展。
camera_distance_percent=125

; Camera shortcuts are active only while this game is in the foreground.
; 镜头快捷键仅在本游戏位于前台时响应；1=开启，0=关闭。
camera_hotkeys=1
; Distance change per press. Hold to repeat; valid 1..50 percentage points.
; 每次调整的百分点（1 到 50）；按住可连续调整。
camera_distance_step=5
; Modifier bitmask: 1=Ctrl, 2=Alt, 4=Shift; add values, 3=Ctrl+Alt, 0=none.
; 修饰键位掩码：1=Ctrl、2=Alt、4=Shift；相加组合，3=Ctrl+Alt，0=无修饰键。
camera_hotkey_modifiers=3
; Windows virtual-key codes (decimal): 33=PageUp, 34=PageDown, 36=Home; 0=disabled.
; Windows 虚拟键码（十进制）：33=PageUp、34=PageDown、36=Home；0=禁用该按键。
; Ctrl+Alt+PageUp: farther; Ctrl+Alt+PageDown: nearer; Ctrl+Alt+Home: reset to 100.
; Ctrl+Alt+PageUp 拉远；Ctrl+Alt+PageDown 拉近；Ctrl+Alt+Home 恢复原始 100%。
; Adjustments save camera_distance_percent to this file automatically.
; 快捷键调整后自动将 camera_distance_percent 保存到本文件。
camera_hotkey_farther=33
camera_hotkey_nearer=34
camera_hotkey_reset=36
