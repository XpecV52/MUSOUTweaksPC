; MUSOUTweaksPC: XInput / native DS4 adapter and Windows platform fixes for Sengoku Musou 2 (x86).
; MUSOUTweaksPC：面向《战国无双2》PC版（32 位）的 XInput/原生 DS4 手柄与窗口兼容修复。
; Restart the game after editing. The frame limiter affects only this game's D3D9 presents.
; 修改后请重启游戏。帧率限制只作用于本游戏的 D3D9 画面提交。
[padfix]
enable=1
; 0=automatic (XInput first, native Sony DS4 second); 1=XInput only; 2=native DS4 only.
; 手柄来源：0=自动（优先 XInput，其次原生 Sony DS4）；1=仅 XInput；2=仅原生 DS4。
backend=0
; Write patch diagnostics: 1=on, 0=off.
; 是否写入补丁诊断日志：1=开启，0=关闭。
log=0
; XInput slot: -1=automatically select and retain a connected slot; or 0..3.
; XInput 槽位：-1=自动选择并保持已连接槽位；也可指定 0 到 3。
xinput_slot=-1
; Only pass controller input while the game is the foreground window: 1=yes, 0=no.
; 仅当前台窗口是游戏时传递手柄输入：1=是，0=否。
foreground_only=1
; Keep D-pad buttons available to the game's DirectInput controller map.
; 向游戏 DirectInput 手柄提供十字键方向按钮。
; DirectInput buttons: Up=13, Down=14, Left=15, Right=16; POV is exposed separately.
; DirectInput 按键编号：上=13、下=14、左=15、右=16；方向帽 POV 另行提供。
dpad_menu_navigation=1
; Keep D-pad directions as four independent buttons; do not inject them into the left-stick movement axes.
; 十字键保持为四个独立按键；不再合并到左摇杆移动轴。
dpad_as_left_stick=0
; Also expose the D-pad as a DirectInput POV hat.
; 将十字键同时作为 DirectInput POV 方向帽提供。
dpad_pov=1
; How the D-pad reaches the game's menus. 0=off; 1=press the arrow keys on the game's own
; DirectInput keyboard device; 2=SendInput (arrow presses at the physical-key layer, seen by
; both the DirectInput device and the window message loop); 3=post the arrow keys to the game
; window only, so the DirectInput device never sees them.
; 十字键送往游戏菜单的方式。0=关闭；1=在游戏自己的 DirectInput 键盘设备上按下方向键；
; 2=SendInput（等同于物理按键，DirectInput 设备和窗口消息循环都能看到）；
; 3=只把方向键消息投递给游戏窗口，DirectInput 设备完全看不到。
; 战国2 的菜单和角色移动读的是同一路键盘输入，所以本作默认用 2，并配合下面的
; menu_inject_only 只在菜单/读盘画面里注入方向键。
dpad_arrow_keys=2
; SendInput arrow hold-to-repeat: pressed time, then gap between repeats, in milliseconds.
; 方向键长按连发节拍：单次按下时长与两次按下之间的间隔（毫秒）。
dpad_arrow_pulse_ms=40
dpad_arrow_gap_ms=80
; Inject the arrow keys only while the frame has no 3D scene in it, i.e. only in menus,
; loading screens and results pages. That is what stops a D-pad press from walking the
; character in battle. 0 = always inject (old behaviour).
; 只在当前帧没有 3D 场景时（菜单、读盘、结算页）注入方向键。这就是十字键在战斗里
; 不会带动角色移动的原因。0=始终注入（旧行为）。
menu_inject_only=1
; How many real 3D draws a frame needs before it counts as a battle scene rather than a menu.
; 一帧里需要多少次真实 3D 绘制才算「战斗场景」而不是「菜单」；默认 16。
menu_draw_threshold=16
; Left-stick deadzone in percent (0..90).
; 左摇杆死区百分比（0 到 90）。
left_deadzone=20
; Right-stick digital direction threshold in percent (10..95).
; 右摇杆数字方向触发阈值百分比（10 到 95）。
right_threshold=55
; LT/RT button activation threshold (1..254).
; LT/RT 扳机按键触发阈值（1 到 254）。
trigger_threshold=40
; Require all controls neutral after connection/focus for this many milliseconds (0..5000).
; 手柄连接或游戏重新获得焦点后，按键松开、摇杆居中的保护时间（毫秒，0 到 5000）。
neutral_ms=250
; Native DS4 right-stick X/Y axis slots (0 X, 1 Y, 2 Z, 3 Rx, 4 Ry, 5 Rz).
; 原生 DS4 右摇杆 X/Y 轴编号（0=X、1=Y、2=Z、3=Rx、4=Ry、5=Rz）。
ds4_right_x=2
ds4_right_y=5

[platform]
; Allow registered background hotkeys while the game is foreground; do not broadcast keystrokes to background text boxes.
; 游戏位于前台时允许后台全局快捷键响应；不会把按键广播到后台文本框。
shared_input=1
; 0 preserves the game's current window mode and render size; 1 uses a borderless desktop-sized window without changing the desktop mode.
; 0 保留游戏当前窗口模式和渲染尺寸；1 使用桌面大小的无边框窗口，不切换桌面显示模式。
window_mode=1
; Keep the game's selected render dimensions; do not override its resolution.
; 保留游戏当前渲染尺寸，不覆盖游戏分辨率。
render_width=0
render_height=0
native_resolution=0
scale_to_fill=0
; Disable IME only inside this game when enabled; left off by default.
; 开启后仅在本游戏内隔离输入法；默认关闭。
disable_game_ime=0
; Leave COM initialization behavior unchanged by default.
; 默认保留游戏原有的 COM 初始化行为。
com_apartment_compat=0
; Bypass both exit confirmations when closing the game window.
; 关闭游戏窗口时跳过退出确认，直接退出。
close_without_confirmation=1
; Limit the game's D3D9 presentation cadence to this FPS; 0 disables the limiter.
; SW2 advances its logic once per rendered frame, so the frame rate IS the game speed:/n; 65 runs everything 8.3% fast, 60 is the cadence the port was built for. Default 60.
; 将游戏 D3D9 画面提交节拍限制为此 FPS；0=不限帧。战国2 的逻辑每渲染一帧推进一次，
; 所以帧率就是游戏速度：65 帧会整体快 8.3%，60 帧才是原作节奏。默认 60。
fps_limit=60
; SW2 engine-resolution port: 0/0 follows the active display's physical pixel size; set both to override.
; 战国2专用引擎分辨率补丁：0/0 自动采用当前显示器物理像素分辨率；自定义时需同时填写宽和高。
internal_render_width=0
internal_render_height=0
; Keep the SW2 HUD/menu positions aligned with the selected render resolution.
; 按所选渲染分辨率校正战国2 HUD 与菜单位置。
sw2_fix_hud=1
; 0=leave the game's camera code unchanged; 1/2 enable alternate upstream camera-ratio patches (not recommended unless needed).
; 0=保留游戏原镜头计算；1/2启用上游的两种镜头比例补丁（未验证前建议保持0）。
sw2_camera_mode=0
