; OrochiZPadX - Xbox XInput to application-local DirectInput (x86)
; OrochiZPadX：将 Xbox XInput 手柄转换为仅供本游戏使用的 DirectInput 虚拟手柄（32 位）
; Restart the game after editing. No global keyboard injection.
; 修改后请重启游戏。本补丁不会向系统全局注入键盘输入。
[padfix]
enable=1
; Enable the virtual DirectInput controller adapter: 1=on, 0=off.
; 是否启用虚拟 DirectInput 手柄适配：1=开启，0=关闭。
; Setting this to 0 does not disable the independent [platform] options below.
; 设为 0 不会关闭下方 [platform] 区域中的独立功能。
log=1
; Write diagnostic details to MUSOUTweaksPC.log: 1=on, 0=off.
; 是否写入 MUSOUTweaksPC.log 诊断日志：1=开启，0=关闭。
; 0 auto (XInput first, then native Sony DS4); 1 Xbox only; 2 native DS4 only.
; 手柄来源：0=自动（优先 XInput，其次原生 Sony DS4）；1=仅 XInput；2=仅原生 DS4。
backend=0
; Native DS4 right stick axis slots: 0 X, 1 Y, 2 Z, 3 Rx, 4 Ry, 5 Rz.
; 原生 DS4 右摇杆轴编号：0=X，1=Y，2=Z，3=Rx，4=Ry，5=Rz。
ds4_right_x=2
ds4_right_y=5
; -1: auto select first connected slot, keep it until game exits. Or 0..3.
; XInput 手柄槽位：-1=自动选择并保持到游戏退出；也可指定 0 到 3。
xinput_slot=-1
; Only pass controller input to the game while it is the foreground window: 1=yes, 0=no.
; 仅在游戏窗口位于前台时向游戏传递手柄输入：1=是，0=否。
foreground_only=1
; Add D-pad buttons only to the game's separate native menu map.
; No synthetic keyboard arrows. Player bindings stay independent.
; 仅将十字键按钮加入游戏独立的菜单映射，不模拟键盘方向键，也不占用玩家按键绑定。
; 1=开启菜单十字键导航，0=关闭该菜单映射补充。
dpad_menu_navigation=1
; -1=automatic (enabled for Shin Sangokumusou 3), 0=off, 1=mirror D-pad directions to the left stick.
; -1=自动（真三国无双3默认开启），0=关闭，1=将十字键方向同步到左摇杆。
dpad_as_left_stick=-1
; Expose the D-pad as a standard DirectInput POV hat as well as four buttons.
; 将十字键同时作为标准 DirectInput POV 方向帽和四个独立按钮提供。
dpad_pov=0
; Left-stick deadzone in percent (0..90). A lower value is more sensitive but may expose stick drift.
; 左摇杆死区百分比（0 到 90）；数值越低越灵敏，但更容易受到摇杆漂移影响。
left_deadzone=20
; Right-stick digital-direction threshold in percent (10..95). Lower triggers more easily.
; 右摇杆数字方向触发阈值百分比（10 到 95）；数值越低越容易触发方向按钮。
right_threshold=55
; LT/RT button activation threshold (1..254). Lower triggers with a lighter press.
; LT/RT 扳机按钮触发阈值（1 到 254）；数值越低，轻压时越容易触发。
trigger_threshold=40
; Release all buttons and center sticks for 250 ms after connect/focus.
; 手柄连接或游戏重新获得焦点后，需保持所有按键松开、摇杆居中一段时间（毫秒）。
; 可设为 0 到 5000；建议保留 250，避免连接或切回时误触。
neutral_ms=250

[platform]
; Share keyboard/mouse access with background hotkey applications.
; 将游戏键鼠输入改为非独占，允许后台全局快捷键应用响应；不会向普通后台文本框广播输入。
; 1=开启共享输入，0=保留游戏原有独占输入行为。
shared_input=1
; 1 borderless desktop window, 0 original game display behavior.
; 窗口模式：1=主显示器原生分辨率无边框全屏窗口；0=使用游戏原始显示行为。
window_mode=1
; 0 uses primary monitor native pixels; explicit values use native rendering.
; 渲染宽度（像素）：0=自动采用主显示器宽度；自定义值范围为 640 到 8192。
render_width=0
; 渲染高度（像素）：0=自动采用主显示器高度；自定义值范围为 360 到 8192。
render_height=0
; 1 forces the active monitor's current desktop resolution as the D3D backbuffer; 0 preserves game resolution.
; 1 强制使用当前显示器桌面分辨率作为 D3D 缓冲区；0 保留游戏自身分辨率。
native_resolution=0
; Independent engine render size. Set both to 0 to use render_width/render_height as before.
; 独立引擎渲染尺寸：两项同时设为 0 时，继续使用上方 render_width/render_height。
; With both enabled, render internally at this size and scale to the current desktop without changing display mode.
; 两项有效时，引擎按指定尺寸渲染，再由游戏主交换链呈现到桌面，不修改系统显示模式。
internal_render_width=3840
internal_render_height=2160
; Orochi Z uses its primary swapchain to preserve video backgrounds; no additional output swapchain.
; 蛇魔 Z 使用游戏主交换链输出，以保留视频背景，不启用额外输出交换链。
; Isolate IME only inside this game. Other applications keep their input method.
; 仅隔离本游戏内的输入法，其他应用不受影响；游戏内不能输入中文。1=开启，0=关闭。
disable_game_ime=1
; Preserve a pre-existing STA apartment if the game requests MTA on that thread.
; 兼容游戏请求 MTA 时线程已处于 STA 的情况；仅处理已确认的 COM 模式冲突。建议保持 1。
com_apartment_compat=1
; Bypass the game's close-confirmation dialog while keeping its normal shutdown path: 1=yes, 0=no.
; 关闭窗口时跳过游戏的确认弹窗，但仍执行正常退出流程：1=跳过，0=保留确认。
close_without_confirmation=1

; 3D camera distance: 100=original, 125=farther, 150=further; valid 50..300.
; 蛇魔Z 战斗镜头远近：100=原始，125=稍远，150=更远；可设 50 到 300。
; Reloaded within 500 ms; move the character/camera to rebuild a cached view.
; 保存后约半秒读取；移动角色或转动视角即可刷新已缓存的镜头。
; Player battle cameras only; preparation maps keep their original framing.
; 仅调整玩家战斗镜头，准备界面地图保持原有取景。
; Moves the viewpoint, preserving FOV, character proportions and HUD scale.
; 移动镜头位置，保持 FOV、人物比例和 HUD 大小不变。
; Large values can place the viewpoint behind walls; native collision is unchanged.
; 倍率过大可能退到墙后；游戏原有镜头避障不会按此倍率扩展。
camera_distance_percent=125

; Camera shortcuts are active only while this game is in the foreground.
; 镜头快捷键仅在本游戏位于前台时响应；1=开启，0=关闭。
camera_hotkeys=1
; Distance change per press. Hold to repeat; valid 1..50 percentage points.
; 每次调整的百分点（1 到 50）；按住可连续调整。
camera_distance_step=5
; Modifier bitmask: 1=Ctrl, 2=Alt, 4=Shift; add values, 3=Ctrl+Alt, 0=none.
; 修饰键位掩码：1=Ctrl、2=Alt、4=Shift；相加组合，3=Ctrl+Alt，0=无修饰键。
camera_hotkey_modifiers=3
; Windows virtual-key codes (decimal): 33=PageUp, 34=PageDown, 36=Home; 0=disabled.
; Windows 虚拟键码（十进制）：33=PageUp、34=PageDown、36=Home；0=禁用该按键。
; Ctrl+Alt+PageUp: farther; Ctrl+Alt+PageDown: nearer; Ctrl+Alt+Home: reset to 100.
; Ctrl+Alt+PageUp 拉远；Ctrl+Alt+PageDown 拉近；Ctrl+Alt+Home 恢复原始 100%。
; Adjustments save camera_distance_percent to this file automatically.
; 快捷键调整后自动将 camera_distance_percent 保存到本文件。
camera_hotkey_farther=33
camera_hotkey_nearer=34
camera_hotkey_reset=36
