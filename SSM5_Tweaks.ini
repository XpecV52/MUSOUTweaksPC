; MUSOUTweaksPC - full controller and borderless display support for DW6 PC (x86)
; MUSOUTweaksPC：为真三国无双5（Dynasty Warriors 6 / SM5_WIN.exe）提供完整手柄适配和无边框全屏支持（32 位）
; Restart the game after editing. No global keyboard injection.
; 修改后请重启游戏。本补丁不会向系统全局注入键盘输入。
[padfix]
enable=1
; Enable the virtual DirectInput controller adapter: 1=on, 0=off.
; 是否启用虚拟 DirectInput 手柄适配：1=开启，0=关闭。
; Setting this to 0 does not disable the independent [platform] options below.
; 设为 0 不会关闭下方 [platform] 区域中的独立功能。
log=0
; Write diagnostic details to MUSOUTweaksPC.log: 1=on, 0=off.
; 是否写入 MUSOUTweaksPC.log 诊断日志：1=开启，0=关闭。
; 0 auto (XInput first, then native Sony DS4); 1 Xbox only; 2 native DS4 only.
; 手柄来源：0=自动（优先 XInput，其次原生 Sony DS4）；1=仅 XInput；2=仅原生 DS4。
backend=0
; Native DS4 right stick axis slots: 0 X, 1 Y, 2 Z, 3 Rx, 4 Ry, 5 Rz.
; 原生 DS4 右摇杆轴编号：0=X，1=Y，2=Z，3=Rx，4=Ry，5=Rz。
ds4_right_x=2
ds4_right_y=5
; -1: auto select first connected slot, keep it until game exits. Or 0..3.
; XInput 手柄槽位：-1=自动选择并保持到游戏退出；也可指定 0 到 3。
xinput_slot=-1
; Only pass controller input to the game while it is the foreground window: 1=yes, 0=no.
; 仅在游戏窗口位于前台时向游戏传递手柄输入：1=是，0=否。
foreground_only=1
; Name the virtual device reports to the game.
; DW6 PC only accepts controllers whose product name is on its built-in list
; (Xbox 360 pad, Logitech ChillStream, ELECOM/SANWA pads, ...). Anything else is
; enumerated but never selected, so the pad would look dead. Leave the default
; unless you know another name from that list works better for you.
; 虚拟手柄向游戏报告的名称。
; 真三国无双5 只认它内置名单里的手柄产品名（Xbox 360 手柄、罗技 ChillStream、
; ELECOM/SANWA 手柄等）。名字不在名单里的话，游戏虽然能枚举到设备，但不会选中它，
; 表现为手柄完全没反应。除非你确定名单里另一个名字更好用，否则保持默认值。
pad_name=Controller (XBOX 360 For Windows)
; Axes the virtual device reports: 2=left stick only, 6=left stick + triggers + right stick.
; 0 or -1 = auto (6 for this game, 2 for the rest of the family).
; DW6 PC steers the camera with the right stick, so it needs the full six.
; 虚拟手柄报告的轴数量：2=只有左摇杆，6=左摇杆+扳机+右摇杆。
; 0 或 -1=自动（本作取 6，其他作品取 2）。真三国无双5 用右摇杆转视角，需要 6 轴。
pad_axes=6
; Add the D-pad buttons to the game's separate native menu map (SSM3/SSM4/Orochi Z).
; DW6 PC has no locatable menu map, so it uses the POV hat and the pulsed mirror.
; 将十字键按钮加入游戏独立的原生菜单映射（真三国3/4、蛇魔Z）。
; 真三国无双5 没有可定位的菜单映射表，因此改用 POV 方向帽和点动镜像。
dpad_menu_navigation=1
; How the D-pad reaches the left-stick axes: 0=off, 1=continuous, 2=pulse, -1=auto.
; Keep this at 0 for this game. The D-pad must stay its own input so it can be
; bound separately and so it never moves the character; menu navigation goes
; through dpad_arrow_keys below instead.
; 十字键输出到左摇杆轴的方式：0=关闭，1=持续，2=点动脉冲，-1=自动。
; 本作请保持 0。十字键要作为独立输入保留下来，才能单独绑键、也才不会让角色
; 移动；菜单光标改由下面的 dpad_arrow_keys 负责。
dpad_as_left_stick=0
; Pulse length in milliseconds for dpad_as_left_stick=2 (0..1000).
; 点动脉冲长度（毫秒），仅对 dpad_as_left_stick=2 生效，范围 0 到 1000。
dpad_menu_pulse_ms=50
; Hold-to-repeat. DW6 PC's menus step the cursor once per D-pad press, so a held
; direction stops moving. After the delay the D-pad is released for
; dpad_menu_pulse_ms every dpad_menu_repeat_ms, which the game reads as a fresh
; press and the cursor keeps moving. Set dpad_menu_repeat_ms=0 to disable.
; Only the keyboard-arrow path repeats; the left stick is never touched.
; 长按连发。真三国无双5 的菜单是"按一次走一格"，按住不放光标就不再动。
; 超过延迟时间后，每 dpad_menu_repeat_ms 松开 dpad_menu_pulse_ms，
; 游戏就会认为又按下了一次，光标于是持续移动。设为 0 可关闭连发。
; 只有键盘方向键这一路会连发，左摇杆完全不动。
; Repeat period in milliseconds (0..1000); 0 disables the repeat.
; 连发周期（毫秒，0 到 1000）；0=关闭连发。
dpad_menu_repeat_ms=120
; Delay before the repeat starts, in milliseconds (0..3000).
; 开始连发前的等待时间（毫秒，0 到 3000）。
dpad_menu_repeat_delay_ms=400
; Press the keyboard arrow keys from the D-pad inside the game's own keyboard
; device: 1=yes, 0=no, -1=auto (on for this game).
; This is how the menu cursor moves. The D-pad keeps its own POV/button
; bindings and the left stick is never touched, so the character never walks.
; 十字键是否在游戏自己的键盘设备里按下方向键：1=开启，0=关闭，-1=自动（本作默认开启）。
; 菜单光标就是靠这一路走的。十字键本身仍作为 POV 方向帽和独立按钮交给游戏，
; 左摇杆完全不动，所以角色不会被带着走。
dpad_arrow_keys=1
; Expose the D-pad as a standard DirectInput POV hat as well as four buttons.
; 将十字键同时作为标准 DirectInput POV 方向帽和四个独立按钮提供。
dpad_pov=1
; Left-stick deadzone in percent (0..90). A lower value is more sensitive but may expose stick drift.
; 左摇杆死区百分比（0 到 90）；数值越低越灵敏，但更容易受到摇杆漂移影响。
left_deadzone=20
; Right-stick digital-direction threshold in percent (10..95). Lower triggers more easily.
; 右摇杆数字方向触发阈值百分比（10 到 95）；数值越低越容易触发方向按钮。
right_threshold=55
; LT/RT button activation threshold (1..254). Lower triggers with a lighter press.
; LT/RT 扳机按钮触发阈值（1 到 254）；数值越低，轻压时越容易触发。
trigger_threshold=40
; Release all buttons and center sticks for 250 ms after connect/focus.
; 手柄连接或游戏重新获得焦点后，需保持所有按键松开、摇杆居中一段时间（毫秒）。
; 可设为 0 到 5000；建议保留 250，避免连接或切回时误触。
neutral_ms=250

[platform]
; Share keyboard/mouse access with background hotkey applications.
; 将游戏键鼠输入改为非独占，允许后台全局快捷键应用响应；不会向普通后台文本框广播输入。
; 1=开启共享输入，0=保留游戏原有独占输入行为。
shared_input=1
; 1 borderless desktop window, 0 original game display behavior.
; 窗口模式：1=主显示器原生分辨率无边框全屏窗口；0=使用游戏原始显示行为。
window_mode=1
; 0 preserves this game's selected render width; explicit values override it.
; 渲染宽度（像素）：0=保留游戏所选宽度；自定义值范围为 640 到 8192。
render_width=0
; Render height in pixels: 0 keeps the game's selected height; custom values 360..8192.
; 渲染高度（像素）：0=保留游戏所选高度；自定义值范围为 360 到 8192。
render_height=0
; Use one primary-chain Present per frame so Steam/RTSS sees one frame and overlays stay attached.
; 每帧只提交一次主交换链，让 Steam/RTSS 按一帧统计，覆盖层保持在游戏画面上。
single_present=1
; Force the backbuffer to the desktop size (native rendering).
; Start with 0: the game renders at the resolution picked in its own settings and
; the borderless window stretches that image, which keeps the camera and the HUD
; exactly as the engine laid them out. Switch to 1 (together with scale_to_fill=1)
; only if you want the scene rendered at the desktop resolution; some Koei ports
; keep their logical screen size and then draw into the top-left corner, which
; looks like a shrunken picture with black margins.
; 是否强制把后备缓冲改成桌面分辨率（原生分辨率渲染）。
; 先用 0：游戏按自己在设置里选的分辨率渲染，再由无边框窗口拉伸铺满，
; 镜头和 HUD 排版保持引擎原本的样子。想要按桌面分辨率真正重绘场景，
; 再同时把 scale_to_fill 设为 1、这一项设为 1；部分无双作品会保留逻辑分辨率
; 只往左上角绘制，那就会变成画面缩小、右下留黑。
native_resolution=0
; Scale the logical game image before its single primary-chain Present.
; Only used together with native_resolution=1.
; 在主交换链唯一一次提交前，将游戏逻辑画面缩放铺满桌面。
; 仅在 native_resolution=1 时生效。
scale_to_fill=0
; 0=point, 1=linear, 2=sharp Catmull-Rom reconstruction.
; 缩放滤镜：0=点采样，1=线性，2=清晰的 Catmull-Rom 重建。
scale_filter=2
; Isolate IME only inside this game. Other applications keep their input method.
; 仅隔离本游戏内的输入法，其他应用不受影响；游戏内不能输入中文。1=开启，0=关闭。
disable_game_ime=1
; Preserve a pre-existing STA apartment if the game requests MTA on that thread.
; 兼容游戏请求 MTA 时线程已处于 STA 的情况；仅处理已确认的 COM 模式冲突。建议保持 1。
com_apartment_compat=1
; Bypass the game's close-confirmation dialog while keeping its normal shutdown path: 1=yes, 0=no.
; 关闭窗口时跳过游戏的确认弹窗，但仍执行正常退出流程：1=跳过，0=保留确认。
close_without_confirmation=1
; Diagnostic: drop a file named MUSOUTweaksPC_capture.flag next to the exe and the
; patch writes the next frame to MUSOUTweaksPC_frame.bmp, then deletes the flag.
; Leave at 0; it only installs an extra Present hook when enabled.
; 诊断用：在 exe 同目录放一个名为 MUSOUTweaksPC_capture.flag 的空文件，补丁会把下一帧
; 存成 MUSOUTweaksPC_frame.bmp 并删掉标记文件。平时保持 0，开启后会多装一个 Present 钩子。
frame_capture=0
